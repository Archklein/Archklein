name: Update README Date

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch:     # Allows you to trigger it manually anytime

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Timestamp
        run: |
          NOW=$(date -u +"%B %d, %Y at %H:%M UTC")
          sed -i "s/<!--DATE_START-->.*<!--DATE_END-->/<!--DATE_START-->🕒 **Last updated:** $NOW<!--DATE_END-->/g" README.md

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: update timestamp in README" && git push)
