name: Update README Date

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch:     # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Timestamp
        run: |
          NOW=$(TZ='Asia/Manila' date +"%B %d, %Y at %I:%M %p PHT")
          sed -i "s/<!--DATE_START-->.*<!--DATE_END-->/<!--DATE_START-->🕒 **Last updated:** $NOW<!--DATE_END-->/g" README.md

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: update timestamp in README" && git push)
